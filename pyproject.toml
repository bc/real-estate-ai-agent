[project]
name = "real-estate-ai-system"
version = "0.1.0"
description = "Real estate AI agent system — property analysis, comps, tax estimation, and more for Denver metro"
requires-python = ">=3.10"
dependencies = [
    "crewai>=0.108.0",
    "crewai-tools[mcp]>=0.45.0",
    "mcp>=1.9.0",
    "python-dotenv>=1.1.0",
    "pandas>=2.2.0",
    "playwright>=1.58.0",
    "playwright-stealth>=2.0.2",
]

[project.scripts]
real-estate-agents = "real_estate_agents:main"
refinance-analyzer = "refinance_analyzer:main"
property-tax = "property_tax_estimator:main"
rent-estimator = "rent_estimator:main"
comp-extractor = "comp_extractor:main"
comps-db = "comps_db:main"
finish-grader = "finish_grader:main"
appreciation-tracker = "appreciation_tracker:main"
browser-scraper = "browser_scraper:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
only-include = [
    "real_estate_agents.py",
    "refinance_analyzer.py",
    "property_tax_estimator.py",
    "rent_estimator.py",
    "comp_extractor.py",
    "comps_db.py",
    "finish_grader.py",
    "appreciation_tracker.py",
    "browser_scraper.py",
]

[tool.uv]
dev-dependencies = []
